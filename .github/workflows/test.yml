name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI Guardian (con dependencias de dev)
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      # Sin GPU NVIDIA ni Docker real: toda la suite usa mocks/fakes para
      # nvidia-smi, docker y las acciones de apagado (ver tests/).
      - name: Ejecutar tests
        run: pytest -v

      # Comprobaciones de shell de update.sh (rama incorrecta, working
      # tree sucio, remoto equivocado). Sin sudo/root/red: usa repos git
      # locales de prueba, nunca toca /opt/ai/guardian ni systemd.
      - name: Ejecutar tests de update.sh
        run: bash tests/test_update_sh.sh
